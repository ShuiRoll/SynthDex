name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # The golden screenshots in test/goldens were rendered on Windows; running
    # the same pixels on Linux fails them by 2-5% on font rasterisation alone.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tools

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release web
        run: flutter build web --release
